# ==============================================================
# 1. ConfigMap: จัดเก็บตัวแปรการตั้งค่าทั่วไป (Non-sensitive)
# ==============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: "mysql-0.mysql-service:3306" # ชี้ไปที่ StatefulSet Pod ผ่าน Headless Service
  DB_NAME: "exam_db"

---
# ==============================================================
# 2. Secret: จัดเก็บข้อมูลความลับ เช่น รหัสผ่านฐานข้อมูล (Sensitive)
# ==============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # Kubernetes จะแปลงเป็น Base64 ให้อัตโนมัติเมื่อใช้ stringData
  db-password: "rootpassword"
